services:
  - type: web
    name: callseal-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: callseal-demo-db
          property: connectionString
      - key: CALLSEAL_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: MAX_AUDIO_MB
        value: "25"

databases:
  - name: callseal-demo-db
    plan: free
    databaseName: callseal
    user: callseal

